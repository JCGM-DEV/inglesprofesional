<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech English Mastery — Aprende Inglés Profesional</title>
    <meta name="description" content="Plataforma interactiva para aprender inglés profesional en el sector IT con ejercicios, flashcards y quizzes.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>TechEnglish</h2>
            </div>

            <div class="lang-toggle-wrap">
                <button id="lang-toggle" class="lang-btn" title="Cambiar idioma">
                    <i class="fa-solid fa-language"></i>
                    <span id="lang-label">Ver en Español</span>
                </button>
            </div>

            <p class="nav-section-title">UNIDADES</p>
            <ul class="nav-links" id="nav-links">
                <li class="active" data-unit="1"><i class="fa-solid fa-book"></i> <span>Unidad 1</span></li>
                <li data-unit="2"><i class="fa-solid fa-users"></i> <span>Unidad 2</span></li>
                <li data-unit="3"><i class="fa-solid fa-file-contract"></i> <span>Unidad 3</span></li>
                <li data-unit="4"><i class="fa-solid fa-briefcase"></i> <span>Unidad 4</span></li>
            </ul>

            <div class="sidebar-footer">
                <div class="progress-container">
                    <p class="progress-label">Progreso Global</p>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="global-progress" style="width: 0%"></div>
                    </div>
                    <p class="progress-text" id="progress-text">0 / 0 ejercicios</p>
                </div>
            </div>
        </nav>

        <!-- Mobile Toggle -->
        <button class="mobile-menu-btn" id="mobile-menu-btn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <header id="main-header">
                <h1 id="header-title">¡Bienvenido a Tech English Mastery!</h1>
                <p id="header-desc">Tu plataforma interactiva para dominar el inglés profesional en el sector IT.</p>
            </header>

            <!-- Tabs -->
            <div class="tabs-container" id="tabs-container">
                <button class="tab active" data-tab="theory"><i class="fa-solid fa-book-open"></i> Teoría</button>
                <button class="tab" data-tab="exercises"><i class="fa-solid fa-pen-to-square"></i> Ejercicios</button>
                <button class="tab" data-tab="flashcards"><i class="fa-solid fa-clone"></i> Flashcards</button>
            </div>

            <div id="content-area" class="content-area">
                <!-- Content loaded dynamically -->
            </div>
        </main>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
